<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Music Player</title>
<style>
  :root{
    --bg:#121212;
    --card:#1c1c1e;
    --accent:#1db954;
    --text:#f5f5f5;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .player{
    width:100%;
    max-width:340px;
    background:var(--card);
    border-radius:16px;
    padding:24px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .art{
    width:100%;
    aspect-ratio:1/1;
    border-radius:10px;
    object-fit:cover;
    margin-bottom:18px;
    background:#000;
  }
  h1{
    font-size:17px;
    font-weight:600;
    margin-bottom:4px;
  }
  p{
    font-size:13px;
    color:var(--muted);
    margin-bottom:20px;
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
  }
  button{
    background:none;
    border:none;
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  button svg{ width:26px; height:26px; fill:currentColor; }
  #playBtn{
    background:var(--accent);
    color:#000;
    width:56px;
    height:56px;
    border-radius:50%;
  }
  #playBtn svg{ width:24px; height:24px; }
  button:active{ transform:scale(0.92); }
</style>
</head>
<body>

<div class="player">
  <img id="art" class="art" src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="cover">
  <h1 id="title">Loading&hellip;</h1>
  <p id="author">&mdash;</p>

  <div class="controls">
    <button id="prevBtn" title="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button id="playBtn" title="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="nextBtn" title="Next">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
  </div>
</div>

<div id="player" style="position:absolute;width:1px;height:1px;opacity:0;"></div>

<script>
/* =========================================================
   TO USE YOUR OWN PLAYLIST:
   1. Open your playlist on YouTube / YouTube Music
   2. Make sure it's set to Public or Unlisted (not Private)
   3. Copy the ID from the URL after "list="
   4. Paste it below
   ========================================================= */
const PLAYLIST_ID = "PLDh_97oxotXYTw7VrgaDMTGq_ljos23Sd";

let ytPlayer;

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('player', {
    height: '1',
    width: '1',
    playerVars: { listType: 'playlist', list: PLAYLIST_ID, autoplay: 0 },
    events: { onReady: updateInfo, onStateChange: onStateChange }
  });
}

function onStateChange(e) {
  const playIcon = document.getElementById('playIcon');
  if (e.data === YT.PlayerState.PLAYING) {
    playIcon.innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'; // pause icon
    updateInfo();
  } else if (e.data === YT.PlayerState.PAUSED) {
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // play icon
  } else if (e.data === YT.PlayerState.ENDED) {
    // loop playlist forever
    const list = ytPlayer.getPlaylist();
    const idx = ytPlayer.getPlaylistIndex();
    if (list && idx === list.length - 1) ytPlayer.playVideoAt(0);
  }
}

function updateInfo() {
  try {
    const data = ytPlayer.getVideoData();
    document.getElementById('title').textContent = data.title || 'Playing…';
    document.getElementById('author').textContent = data.author || '';
    document.getElementById('art').src = `https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;
  } catch (e) {
    setTimeout(updateInfo, 500);
  }
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (!ytPlayer) return;
  const state = ytPlayer.getPlayerState();
  if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
  else ytPlayer.playVideo();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  ytPlayer.nextVideo();
  setTimeout(updateInfo, 400);
});

document.getElementById('prevBtn').addEventListener('click', () => {
  ytPlayer.previousVideo();
  setTimeout(updateInfo, 400);
});

const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);
</script>

</body>
</html>
